<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="utf-8">
<title>Sendero Spanish</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one centered column (max 880px) — header, tab bar, view; sessions take over the column as a focused card flow. */
:root {
  --bg: #eef1f7; --surface: #ffffff; --surface2: #f5f7fc; --ink: #121a33; --muted: #58627f; --line: #d8deeb;
  --accent: #2346c8; --accent-ink: #ffffff; --accent-soft: #e2e8ff;
  --gold: #a86600; --gold-soft: #fff0d2;
  --ok: #1b7a45; --ok-soft: #dcf2e4; --bad: #bb3129; --bad-soft: #fde4e1; --warn-soft: #fff4dc;
  --g0: transparent; --g1: #e8dfb6; --g2: #b8d89a; --g3: #6fbf73; --g4: #2f9a5a; --g5: #136b3e;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b1020; --surface: #141b2f; --surface2: #10172a; --ink: #e6eaf6; --muted: #9aa4c2; --line: #263052;
  --accent: #8aa2ff; --accent-ink: #0b1020; --accent-soft: #1d2853;
  --gold: #f2b445; --gold-soft: #3a2a0c;
  --ok: #5fcf8c; --ok-soft: #12321f; --bad: #ff8a80; --bad-soft: #3d1715; --warn-soft: #33270e;
  --g1: #5b5532; --g2: #4d7a3a; --g3: #3f9e57; --g4: #4cc67a; --g5: #9be8b0; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0b1020; --surface: #141b2f; --surface2: #10172a; --ink: #e6eaf6; --muted: #9aa4c2; --line: #263052;
  --accent: #8aa2ff; --accent-ink: #0b1020; --accent-soft: #1d2853;
  --gold: #f2b445; --gold-soft: #3a2a0c;
  --ok: #5fcf8c; --ok-soft: #12321f; --bad: #ff8a80; --bad-soft: #3d1715; --warn-soft: #33270e;
  --g1: #5b5532; --g2: #4d7a3a; --g3: #3f9e57; --g4: #4cc67a; --g5: #9be8b0; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 16px/1.55 var(--body); }
#app { max-width: 880px; margin: 0 auto; padding-block: 18px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 18px; }
h1, h2, h3, h4 { font-family: var(--display); line-height: 1.15; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: clamp(2rem, 6vw, 2.9rem); font-weight: 800; }
h2 { font-size: 1.65rem; font-weight: 800; }
h3 { font-size: 1.05rem; font-weight: 700; }
h4 { font-size: 0.98rem; font-weight: 700; margin-top: 14px; }
p { margin: 0; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.small { font-size: 0.88rem; color: var(--muted); }
.muted { color: var(--muted); }
.eyebrow { font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); font-weight: 700; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
a { color: var(--accent); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* header */
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 8px; font-family: var(--display); font-weight: 800; font-size: 1.45rem; }
.brand small { font: 700 0.72rem var(--body); text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
.mark { width: 22px; height: 22px; align-self: center; border-radius: 6px; background:
  radial-gradient(circle at 25% 75%, var(--accent-ink) 0 2.5px, transparent 3px),
  radial-gradient(circle at 50% 50%, var(--accent-ink) 0 2.5px, transparent 3px),
  radial-gradient(circle at 75% 25%, var(--gold) 0 3px, transparent 3.5px), var(--accent); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { display: inline-flex; gap: 5px; align-items: baseline; padding: 4px 11px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line); font-size: 0.86rem; color: var(--muted); }
.chip b { font-family: var(--mono); color: var(--ink); }
.chip.gold { background: var(--gold-soft); border-color: transparent; color: var(--gold); }
.chip.gold b { color: var(--gold); }
.tabs { display: flex; gap: 4px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow-x: auto; }
.tabs button { flex: 1; border: 0; background: none; padding: 9px 12px; border-radius: 9px; font-weight: 700; color: var(--muted); white-space: nowrap; }
.tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
main { display: flex; flex-direction: column; gap: 18px; }
.foot { text-align: center; font-size: 0.8rem; color: var(--muted); }

/* buttons */
.btn { border: 1px solid var(--line); background: var(--surface); padding: 10px 16px; border-radius: 10px; font-weight: 700; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--bad); border-color: var(--bad); background: transparent; }
.btn.big { padding: 13px 22px; font-size: 1.05rem; }
.btn.sm { padding: 6px 12px; font-size: 0.88rem; }
.btn:disabled { opacity: 0.5; cursor: default; }
.ico { border: 1px solid var(--line); background: var(--surface2); width: 34px; height: 34px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 0.8rem; vertical-align: middle; }
.ico.slow { font-family: var(--mono); font-size: 0.75rem; }
.audio { display: inline-flex; gap: 6px; vertical-align: middle; margin-left: 6px; }
.tag { display: inline-block; font: 700 0.72rem var(--body); text-transform: uppercase; letter-spacing: 0.06em; padding: 3px 8px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); }

/* today */
.hero { display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 26px; }
.hero-text { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.lede { font-size: 1.08rem; color: var(--muted); max-width: 46ch; }
.goal { position: relative; width: 132px; height: 132px; }
.ring { width: 100%; height: 100%; }
.ring-bg { fill: none; stroke: var(--surface2); stroke-width: 8; }
.ring-fg { fill: none; stroke: var(--gold); stroke-width: 8; stroke-linecap: round; transition: stroke-dasharray .6s; }
.goal-txt { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.goal-txt b { font-size: 1.7rem; line-height: 1; }
.goal-txt span { font-size: 0.74rem; color: var(--muted); max-width: 80px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.stat { display: flex; align-items: baseline; gap: 8px; }
.stat b { font-size: 1.5rem; }
.stat span { font-size: 0.88rem; color: var(--muted); }
.bar { height: 8px; border-radius: 99px; background: var(--surface2); overflow: hidden; position: relative; }
.bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 99px; }
.bar.two i.strong { background: var(--g4); }
.meter { position: relative; height: 54px; }
.meter::before { content: ""; position: absolute; left: 0; right: 0; top: 14px; height: 10px; border-radius: 99px; background: var(--surface2); }
.meter .zone { position: absolute; top: 14px; height: 10px; background: var(--ok); opacity: .45; border-radius: 3px; }
.meter .pin { position: absolute; top: 6px; width: 4px; height: 26px; margin-left: -2px; background: var(--ink); border-radius: 2px; }
.meter .ticks { position: absolute; left: 0; right: 0; top: 32px; display: flex; justify-content: space-between; font: 0.72rem var(--mono); color: var(--muted); }
.story-name { font-family: var(--display); font-weight: 700; font-size: 1.12rem; }
.cov { position: relative; height: 10px; border-radius: 99px; background: var(--surface2); }
.cov i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 99px; background: var(--muted); }
.cov i.mid { background: var(--g3); } .cov i.ok { background: var(--g4); }
.cov span { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); opacity: .55; }
.cov-l { font-size: 0.85rem; }
.settings summary { cursor: pointer; font-weight: 700; font-family: var(--display); }
.set-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px 14px; align-items: center; margin-top: 10px; }
.set-grid .span2 { grid-column: 1 / -1; }
.set-grid select, .set-grid input[type=range] { width: 100%; }
select, textarea { font: inherit; padding: 7px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface2); color: var(--ink); width: 100%; }
output { font-family: var(--mono); color: var(--accent); margin-left: 6px; }

/* intro text */
.intro { display: flex; flex-direction: column; gap: 8px; }
.intro p { color: var(--muted); max-width: 68ch; }

/* path */
.units { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
.unit { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
.unit.focus { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.unit.locked { background: transparent; border-style: dashed; }
.u-head { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; align-items: center; }
.u-head > div { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.u-n { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); font-size: 1rem; }
.locked .u-n { background: var(--surface2); color: var(--muted); }
.u-es { font: italic 400 0.92rem var(--body); color: var(--muted); }
.unit details { margin-top: 10px; }
.unit summary { cursor: pointer; color: var(--accent); font-weight: 700; font-size: 0.92rem; }
.unit details p { max-width: 68ch; }
.why { background: var(--surface2); border-radius: 10px; padding: 12px 14px; margin-top: 10px; font-size: 0.94rem; }

/* reading */
.stories { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.story-card { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.story-card.dim .story-name { color: var(--muted); }
.story { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 22px; display: flex; flex-direction: column; gap: 14px; }
.story-text { font-size: 1.32rem; line-height: 2; }
.w { border: 0; background: none; padding: 0 1px; font: inherit; border-radius: 4px; }
.w.unk { text-decoration: underline dotted var(--bad) 2px; text-underline-offset: 5px; }
.w:hover { background: var(--accent-soft); }
.story-en { color: var(--muted); font-style: italic; }
.gloss { background: var(--surface2); border-radius: 10px; padding: 10px 14px; min-height: 48px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.q p { font-weight: 700; margin-bottom: 6px; }

/* garden */
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 0.86rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend .cell { width: 14px; height: 14px; }
.g-unit h4 { margin: 0 0 6px; font-size: 0.86rem; color: var(--muted); font-family: var(--body); }
.g-row { display: flex; flex-wrap: wrap; gap: 5px; }
.cell { width: 24px; height: 24px; border-radius: 6px; border: 1px solid transparent; padding: 0; display: inline-block; }
.cell.s0 { background: transparent; border: 1.5px dashed var(--line); }
.cell.s1 { background: var(--g1); } .cell.s2 { background: var(--g2); } .cell.s3 { background: var(--g3); }
.cell.s4 { background: var(--g4); } .cell.s5 { background: var(--g5); }
.cell.thirsty { opacity: .4; box-shadow: inset 0 0 0 2px var(--gold); }
.g-detail { min-height: 70px; }

/* method */
.method { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.m-item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 8px; }
.m-item p { font-size: 0.95rem; }
.refs { margin: 0; padding-left: 18px; font-size: 0.86rem; }

/* session */
.s-top { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; }
.trail { display: flex; gap: 3px; align-items: center; overflow: hidden; }
.trail i { flex: 1; height: 8px; min-width: 4px; border-radius: 99px; background: var(--line); }
.trail i.done { background: var(--accent); }
.trail i.now { background: var(--gold); height: 12px; }
.trail i.lesson { max-width: 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: clamp(18px, 4vw, 30px); display: flex; flex-direction: column; gap: 14px; }
.card.lesson p { max-width: 64ch; }
.big-es { font-family: var(--display); font-weight: 800; font-size: clamp(1.9rem, 6vw, 2.6rem); line-height: 1.15; }
.big-en { font-family: var(--display); font-weight: 700; font-size: clamp(1.6rem, 5vw, 2.1rem); }
.meaning { font-size: 1.12rem; color: var(--muted); }
.cloze { font-size: clamp(1.4rem, 4.5vw, 1.8rem); font-family: var(--display); font-weight: 700; }
.gap { display: inline-block; min-width: 3.5em; border-bottom: 3px solid var(--accent); color: var(--accent); text-align: center; padding: 0 6px; font-weight: 500; font-family: var(--body); font-size: 0.8em; }
.answered.right .gap, .answered.close .gap { color: var(--ok); border-color: var(--ok); }
.mcq { font-size: 1.3rem; font-weight: 700; }
.demo { display: flex; flex-wrap: wrap; gap: 8px 24px; }
.answer-line { font-size: 1.15rem; }
.gap.filled { color: var(--ok); border-color: var(--ok); font-weight: 700; }
.listen .ico { width: 64px; height: 64px; font-size: 1.3rem; }
.listen .ico.slow { width: 48px; height: 48px; font-size: 1rem; }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px; }
.opt { text-align: left; border: 1.5px solid var(--line); background: var(--surface2); border-radius: 12px; padding: 12px 14px; display: flex; gap: 10px; align-items: center; }
.opt kbd { font: 0.75rem var(--mono); color: var(--muted); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt:disabled { cursor: default; color: var(--ink); }
.answer { display: flex; flex-direction: column; gap: 10px; }
.answer input { font: 1.25rem var(--body); padding: 13px 15px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface2); color: var(--ink); width: 100%; }
.answer input:focus { border-color: var(--accent); outline: none; }
.answered.right .answer input { border-color: var(--ok); }
.answered.close .answer input { border-color: var(--gold); }
.answered.wrong .answer input { border-color: var(--bad); text-decoration: line-through; }
.accents { display: flex; flex-wrap: wrap; gap: 6px; }
.acc { min-width: 38px; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface2); font-weight: 700; }
.fb { border-top: 1px solid var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 10px; }
.verdict { font-family: var(--display); font-weight: 800; font-size: 1.35rem; }
.right .verdict { color: var(--ok); } .close .verdict { color: var(--gold); } .wrong .verdict { color: var(--bad); }
.xp { font: 500 0.9rem var(--mono); color: var(--gold); background: var(--gold-soft); padding: 2px 8px; border-radius: 99px; vertical-align: middle; }
.note { background: var(--surface2); border-radius: 10px; padding: 9px 12px; font-size: 0.94rem; }
.note.warn { background: var(--warn-soft); }
.note.good { background: var(--ok-soft); }
.ex { font-size: 1.1rem; } .ex-en { color: var(--muted); font-size: 0.94rem; margin-top: -8px; }
.sum-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.sum-grid .stat { flex-direction: column; gap: 2px; background: var(--surface2); border-radius: 12px; padding: 12px; }


/* plan */
.between { justify-content: space-between; }
.plan { gap: 12px; }
.blocks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.block { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 12px 14px; border-radius: 12px; background: var(--surface2); }
.block.met { background: var(--ok-soft); }
.block.met .bar i { background: var(--ok); }
.b-main { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.b-name { font-family: var(--display); font-weight: 700; font-size: 1.05rem; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.b-side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.res { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; font-size: 0.95rem; }
.phases { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.phase { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.phase.now { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.phase .here { color: var(--accent); font-weight: 700; }
/* reading */
.today-story { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; background: var(--accent-soft); border-radius: var(--r); padding: 18px; }
.today-story > div { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1 1 260px; }
.w.new { text-decoration: underline solid var(--gold) 3px; text-underline-offset: 5px; }
/* play */
.lives { display: inline-flex; gap: 5px; }
.lives i { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
.lives i.on { background: var(--accent); }
.g-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.g-tile { min-height: 64px; padding: 8px 6px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface2); font-weight: 700; font-size: 0.98rem; overflow-wrap: anywhere; line-height: 1.2; }
.g-tile.sel { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.g-solved { display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; border-radius: 12px; padding: 10px; }
.g-solved.s0 { background: var(--g1); } .g-solved.s1 { background: var(--g2); } .g-solved.s2 { background: var(--accent-soft); } .g-solved.s3 { background: var(--gold-soft); }
.g-solved.missed { background: var(--surface2); border: 1.5px dashed var(--line); }
.g-msg { min-height: 1.4em; color: var(--gold); font-weight: 700; }
.g-gloss { list-style: none; padding: 0; margin: 8px 0 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 6px; }
.sp-head { font-size: 1.1rem; }
.sprint .big-es { text-align: center; }
/* speak & write */
.seg { display: inline-flex; gap: 4px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; align-self: flex-start; }
.seg button { border: 0; background: none; padding: 8px 16px; border-radius: 9px; font-weight: 700; color: var(--muted); }
.seg button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
.seg button[aria-selected="true"] .small { color: inherit; }
.steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.blur { filter: blur(7px); user-select: none; }
textarea#w-text { font: 1.12rem/1.6 var(--body); padding: 12px 14px; border-radius: 12px; border: 2px solid var(--line); resize: vertical; }
textarea#w-text:focus { border-color: var(--accent); outline: none; }
.w-prompt { font-size: 1.3rem; }
.w-corr { font-size: 1.12rem; line-height: 1.7; }
.w-changes { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 8px; }
.w-from { text-decoration: line-through; color: var(--bad); }

<script>
// ===== Sendero curriculum content (Latin American Spanish, A1) =====
// Item kinds: w = word/chunk (two cards: r = Spanish→English, p = English→Spanish)

const W = (id, es, en, o = {}) => ({ kind: 'w', id, es, en, ...o });

const D = (id, say, en) => ({ kind: 'd', id, say, a: [say], en });

const PERSONS = ['yo', 'tú', 'él / ella', 'nosotros', 'ellos / ustedes'];

const UNITS = [
{
  id: 'u0', n: 0, title: 'Sounds & spelling', es: 'Sonidos',
  why: 'Spanish spelling is almost perfectly phonetic, so learning the sound rules first lets you pronounce every new word you read. The hard parts for English speakers are well documented: keeping unstressed vowels pure, the tap r, and the soft d between vowels.',
  lesson: [
    ['Five pure vowels', 'a e i o u always sound the same. English turns unstressed vowels into “uh” (banana → buh-NA-nuh). Spanish never does: ba-na-na, three clear a’s.'],
    ['Letters that differ', 'h is silent (hola). j, and g before e/i, is a breathy h (jamón, gente). ll and y sound like English y in most of Latin America. ñ is “ny” (año). b and v are the same sound. c before e/i and z sound like s in Latin America.'],
    ['r, rr and soft d', 'A single r between vowels is a quick tap, like the tt in American “butter”: pero (but). rr and an r at the start of a word are trilled: perro (dog), Roma. Between vowels, d softens toward the th in “this”: nada.'],
    ['Stress rules', 'Ending in a vowel, n or s → stress the second-to-last syllable (HA-blan). Any other ending → stress the last syllable (pa-PEL). A written accent overrides both (te-LÉ-fo-no).']
  ],
  items: [
    M('s-a', 'How many vowel sounds does Spanish have?', ['5', '8', '12'], 0, 'Five pure vowels: a, e, i, o, u. Each always sounds the same, stressed or not.', 'a, e, i, o, u'),
    M('s-red', 'In “banana”, the unstressed a’s sound like…', ['the same clear “ah” as the stressed one', '“uh”, like in English banana'], 0, 'Spanish never reduces unstressed vowels to “uh”. Every vowel keeps its full sound.', 'banana'),
    M('s-h', 'In “hola”, the h is…', ['silent', 'like English h', 'like English j'], 0, 'H is always silent: hola sounds like “OH-la”.', 'hola'),
    M('s-j', 'In “jamón”, the j sounds like…', ['a strong, breathy h', 'the j in “jam”', 'silent'], 0, 'J (and g before e or i) is a breathy h made further back in the throat: jamón, gente.', 'jamón'),
    M('s-ll', 'In Latin American Spanish, the ll in “llamo” sounds like…', ['English y', 'English l', 'English j'], 0, 'Most of Latin America says ll like y: “YA-mo”. Argentina and Uruguay say it closer to “sh”.', 'me llamo'),
    Object.assign(M('s-r', 'Listen. Which word did you hear?', ['perro (trilled rr)', 'pero (single tap r)'], 0, 'A single r between vowels is a quick tap, like the tt in American “butter”. rr is a rolled trill. pero means “but”; perro means “dog”.', 'perro'), { listen: true, demo: ['pero', 'perro'] }),
    M('s-d', 'In “nada”, the d between the vowels sounds like…', ['a soft “th” as in “this”', 'a hard English d'], 0, 'Between vowels, d softens toward the th in “this”. English speakers pick this up late, so listen for it: nada, todo.', 'nada'),
    M('s-bv', '“vaca” and “baca” sound…', ['the same', 'different, because v is like English v'], 0, 'Spanish b and v are one sound. Between vowels both soften, with the lips nearly touching.', 'vaca'),
    M('s-c', 'In Latin America, “cena” starts with…', ['an s sound', 'a th sound', 'a k sound'], 0, 'C before e or i, and z, sound like s in Latin America. Spain uses a th sound.', 'cena'),
    M('s-st1', 'Where is the stress in “hablan”?', ['HA-blan', 'ha-BLAN'], 0, 'Words ending in a vowel, n or s stress the second-to-last syllable.', 'hablan'),
    M('s-st2', 'Where is the stress in “papel”?', ['pa-PEL', 'PA-pel'], 0, 'Words ending in any other consonant stress the last syllable.', 'papel'),
    M('s-st3', 'Where is the stress in “teléfono”?', ['te-LÉ-fo-no', 'te-le-FO-no'], 0, 'A written accent overrides the rules and marks the stressed syllable.', 'teléfono'),
    D('s-d1', 'hola', 'hello'),
    D('s-d2', 'mesa', 'table'),
    D('s-d3', 'perro', 'dog'),
    D('s-d4', 'gracias', 'thank you'),
  ]
},
{
  id: 'u1', n: 1, title: 'Survival chunks', es: 'Frases útiles',
  why: 'Beginners who store whole phrases as single units can talk sooner, and those phrases later become the raw material for grammar. You will learn “me gusta” here as a chunk and take it apart in Unit 9.',
  lesson: [
    ['Learn phrases whole', 'Don’t analyze these yet. Treat “¿Cómo te llamas?” like one long word that means “What’s your name?”.'],
    ['tú and usted', 'tú is informal “you” (friends, people your age). usted is polite “you” (strangers, older people, service). Latin America uses ustedes for “you all”.'],
    ['Upside-down marks', 'Questions and exclamations open with ¿ and ¡. They tell you how to read the sentence before you reach the end.']
  ],
  items: [
    W('hola', 'hola', ['hello', 'hi'], { forms: ['hola'] }),
    W('buenosdias', 'buenos días', ['good morning'], { forms: ['buenos', 'días'] }),
    W('buenastardes', 'buenas tardes', ['good afternoon'], { forms: ['buenas', 'tardes'] }),
    W('buenasnoches', 'buenas noches', ['good evening', 'good night'], { forms: ['noches'] }),
    W('comoestas', '¿Cómo estás?', ['how are you', 'how are you doing'], { note: 'Informal (tú). Polite form: ¿Cómo está usted?', forms: ['estás'] }),
    W('bien', 'bien', ['well', 'fine', 'good'], { ex: ['Estoy bien, gracias.', 'I’m fine, thanks.'], forms: ['bien'] }),
    W('gracias', 'gracias', ['thank you', 'thanks'], { forms: ['gracias'] }),
    W('ytu', '¿Y tú?', ['and you'], { forms: ['tú'] }),
    W('comotellamas', '¿Cómo te llamas?', ['what is your name', 'what’s your name'], { note: 'Literally “How do you call yourself?”', forms: ['te', 'llamas'] }),
    W('mellamo', 'me llamo…', ['my name is', 'i am called'], { ex: ['Me llamo Ana.', 'My name is Ana.'], forms: ['me', 'llamo', 'llama', 'se'] }),
    W('muchogusto', 'mucho gusto', ['nice to meet you', 'pleased to meet you'], { forms: ['gusto'] }),
    W('porfavor', 'por favor', ['please'], { forms: ['por', 'favor'] }),
    W('denada', 'de nada', ['you’re welcome', 'no problem'], { forms: ['nada'] }),
    W('perdon', 'perdón', ['sorry', 'excuse me', 'pardon'], { forms: ['perdón'] }),
    W('no', 'no', ['no', 'not'], { ex: ['No soy profesor.', 'I’m not a teacher.'], forms: ['no'] }),
    W('noentiendo', 'no entiendo', ['i don’t understand', 'i do not understand'], { forms: ['entiendo'] }),
    W('comosedice', '¿Cómo se dice…?', ['how do you say', 'how is it said'], { forms: ['dice'] }),
    W('despacio', 'más despacio, por favor', ['slower please', 'more slowly please', 'slower'], { forms: ['despacio'] }),
    W('si', 'sí', ['yes'], { note: 'With the accent, sí = yes. Without it, si = if.', forms: ['sí'] }),

    D('g-d1', 'mucho gusto', 'nice to meet you'),
    D('g-d2', 'no entiendo', 'I don’t understand'),
  ]

{
  id: 'u2', n: 2, title: 'Who you are: ser', es: 'Ser',
  why: 'Learners pick up ser well before estar, and they first use it to say who and what someone is. Spanish usually drops subject pronouns because the verb ending already says who. Learners tend to read past those endings and default to “he/she”, so the tasks here make the ending your only clue.',
  lesson: [
    ['ser = to be (identity)', 'Use ser for who or what someone is, where they’re from, and their job: Soy Mike. Soy de Canadá. Es profesora.'],
    ['The forms', 'yo soy · tú eres · él/ella/usted es · nosotros somos · ellos/ellas/ustedes son'],
    ['Drop the pronoun', '“Soy estudiante” is more natural than “Yo soy estudiante”. The ending tells you who. Keep the pronoun only for emphasis or contrast.'],
    ['No “a” for jobs', 'Soy ingeniero = I’m an engineer. Spanish skips un/una before a bare profession.']
  ],
  items: [
    W('ser', 'ser', ['to be'], { note: 'For identity, origin and profession.', forms: ['ser', 'soy', 'eres', 'es', 'somos', 'son'] }),
    W('yo', 'yo', ['i'], { forms: ['yo'] }),
    W('tu', 'tú', ['you (informal)'], { forms: ['tú'] }),
    W('el', 'él', ['he'], { note: 'With an accent, él = he. Without it, el = the.', forms: ['él'] }),
    W('ella', 'ella', ['she'], { forms: ['ella'] }),
    W('usted', 'usted', ['you (polite)'], { forms: ['usted'] }),
    W('nosotros', 'nosotros', ['we'], { note: 'nosotras if the group is all women.', forms: ['nosotros', 'nosotras'] }),
    W('ellos', 'ellos', ['they'], { note: 'ellas if the group is all women.', forms: ['ellos', 'ellas'] }),
    W('ustedes', 'ustedes', ['you all', 'you (plural)'], { forms: ['ustedes'] }),
    W('de', 'de', ['from', 'of'], { ex: ['Soy de Canadá.', 'I’m from Canada.'], forms: ['de'] }),
    W('y', 'y', ['and'], { forms: ['y'] }),
    W('mi', 'mi', ['my'], { note: 'Plural: mis (mis amigos).', forms: ['mi', 'mis'] }),
    W('estudiante', 'el / la estudiante', ['student'], { cog: true, forms: ['estudiante', 'estudiantes'] }),
    W('profesor', 'el profesor / la profesora', ['teacher', 'professor'], { forms: ['profesor', 'profesora', 'profesores'] }),
    W('amigo', 'el amigo / la amiga', ['friend'], { forms: ['amigo', 'amiga', 'amigos', 'amigas'] }),
    W('ingeniero', 'el ingeniero / la ingeniera', ['engineer'], { cog: true, forms: ['ingeniero', 'ingeniera', 'ingenieros'] }),
    W('canadiense', 'canadiense', ['canadian'], { cog: true, forms: ['canadiense', 'canadienses'] }),
    C('c-soy', 'Yo ___ estudiante.', ['soy'], 'I am a student.', 'ser', 'yo → soy'),
    C('c-eres', '¿Tú ___ de México?', ['eres'], 'Are you from Mexico?', 'ser', 'tú → eres'),
    C('c-es', 'Ella ___ profesora.', ['es'], 'She is a teacher.', 'ser', 'él / ella / usted → es'),
    C('c-somos', 'Nosotros ___ canadienses.', ['somos'], 'We are Canadian.', 'ser', 'nosotros → somos'),
    C('c-son', 'Ellos ___ de Colombia.', ['son'], 'They are from Colombia.', 'ser', 'ellos / ustedes → son'),
    P('pi-soy', 'Soy de Vancouver.', PERSONS, 0, 'I’m from Vancouver.', 'soy can only be yo. No pronoun needed.'),
    P('pi-son', 'Son ingenieros.', PERSONS, 4, 'They are engineers.', 'son = ellos or ustedes. The -s on ingenieros backs it up.'),
    P('pi-eres', '¿Eres estudiante?', PERSONS, 1, 'Are you a student?', 'eres is always tú.'),
    P('pi-somos', 'Somos amigos.', PERSONS, 3, 'We are friends.', 'somos is always nosotros.'),
  ]
},
{
  id: 'u3', n: 3, title: 'Things & gender', es: 'Cosas y género',
  why: 'Every noun has a gender, and English gives you nothing to lean on. Learners get the gender of each noun right before they get adjectives to agree with it, and nouns for people and animals come first. So you learn every noun together with its article, and the exceptions get their own practice. This unit also covers false friends, the few look-alike words that will trick you.',
  lesson: [
    ['Learn the noun with its article', 'Don’t learn “libro”. Learn “el libro”. The article is the gender, and you’ll need it for every adjective later.'],
    ['Reliable endings', '-o is usually masculine (el libro), -a usually feminine (la casa). -dad, -ción and -sión are feminine (la ciudad, la canción).'],
    ['The famous exceptions', 'el día, la mano, and Greek words in -ma (el problema, el sistema).'],
    ['Articles', 'the: el / la, plural los / las. a: un / una, plural unos / unas (some).'],
    ['Cognates and false friends', 'Thousands of words look like English and mean the same thing (familia, teléfono, universidad). A few dozen look alike but don’t match: embarazada = pregnant, librería = bookstore, éxito = success.']
  ],
  items: [
    W('libro', 'el libro', ['book'], { noun: 'm', forms: ['libro', 'libros'] }),
    W('casa', 'la casa', ['house', 'home'], { noun: 'f', forms: ['casa', 'casas'] }),
    W('mesa', 'la mesa', ['table'], { noun: 'f', forms: ['mesa', 'mesas'] }),
    W('perro', 'el perro', ['dog'], { noun: 'm', forms: ['perro', 'perros'] }),
    W('gato', 'el gato', ['cat'], { noun: 'm', forms: ['gato', 'gatos'] }),
    W('hombre', 'el hombre', ['man'], { noun: 'm', forms: ['hombre', 'hombres'] }),
    W('mujer', 'la mujer', ['woman', 'wife'], { noun: 'f', forms: ['mujer', 'mujeres'] }),
    W('familia', 'la familia', ['family'], { noun: 'f', cog: true, forms: ['familia'] }),
    W('telefono', 'el teléfono', ['phone', 'telephone'], { noun: 'm', cog: true, forms: ['teléfono'] }),
    W('ciudad', 'la ciudad', ['city'], { noun: 'f', note: '-dad words are feminine.', forms: ['ciudad', 'ciudades'] }),
    W('universidad', 'la universidad', ['university', 'college'], { noun: 'f', cog: true, forms: ['universidad'] }),
    W('cancion', 'la canción', ['song'], { noun: 'f', note: '-ción words are feminine.', forms: ['canción', 'canciones'] }),
    W('dia', 'el día', ['day'], { noun: 'm', note: 'Exception: ends in -a but is masculine.', forms: ['día', 'días'] }),
    W('mano', 'la mano', ['hand'], { noun: 'f', note: 'Exception: ends in -o but is feminine.', forms: ['mano', 'manos'] }),
    W('problema', 'el problema', ['problem'], { noun: 'm', cog: true, note: 'Greek -ma words are masculine.', forms: ['problema', 'problemas'] }),
    W('un', 'un / una', ['a', 'an'], { forms: ['un', 'una', 'unos', 'unas'] }),
    W('la', 'el / la', ['the'], { forms: ['el', 'la', 'los', 'las'] }),
    W('en', 'en', ['in', 'at', 'on'], { forms: ['en'] }),
    W('con', 'con', ['with'], { forms: ['con'] }),
    W('su', 'su', ['his', 'her', 'their', 'your (polite)'], { note: 'Plural: sus.', forms: ['su', 'sus'] }),
    W('pero', 'pero', ['but'], { forms: ['pero'] }),
    W('ff-embarazada', 'embarazada', ['pregnant'], { ff: 'Not “embarrassed” (that’s avergonzado/a).', forms: ['embarazada'] }),
    W('ff-libreria', 'la librería', ['bookstore', 'bookshop'], { noun: 'f', ff: 'Not “library” (that’s la biblioteca).', forms: ['librería'] }),
    W('ff-exito', 'el éxito', ['success'], { noun: 'm', ff: 'Not “exit” (that’s la salida).', forms: ['éxito'] }),
    W('ff-actual', 'actual', ['current', 'present-day'], { ff: 'Not “actual” (that’s real or verdadero).', forms: ['actual'] }),
    W('ff-largo', 'largo', ['long'], { ff: 'Not “large” (that’s grande).', forms: ['largo', 'larga'] }),
    W('ff-ropa', 'la ropa', ['clothes', 'clothing'], { noun: 'f', ff: 'Not “rope” (that’s la cuerda).', forms: ['ropa'] }),
    C('c-art1', '___ ciudad es grande.', ['la'], 'The city is big.', 'el / la', '-dad words are feminine.'),
    C('c-art2', 'Es ___ problema.', ['un'], 'It’s a problem.', 'un / una', 'problema is masculine.'),
    C('c-art3', '___ días son largos.', ['los'], 'The days are long.', 'los / las', 'día is masculine → los días.'),
    C('c-art4', 'Es ___ mano.', ['una'], 'It’s a hand.', 'un / una', 'mano is feminine.'),
    C('c-art5', '___ canción es bonita.', ['la'], 'The song is pretty.', 'el / la', '-ción words are feminine.'),
  ]
},
{
  id: 'u4', n: 4, title: 'Everyday verbs: -ar', es: 'Verbos en -ar',
  why: 'The present tense is the first verb system learners acquire. -ar verbs are the largest and most regular group. Learners usually fall back on the él/ella form when unsure, so practice starts with reading endings (input) before you type them.',
  lesson: [
    ['The endings', 'hablar → yo hablo · tú hablas · él/ella/usted habla · nosotros hablamos · ellos/ustedes hablan'],
    ['Read the ending first', 'Hablamos español has no pronoun, but -amos can only mean “we”. Train your eye on the last syllable.'],
    ['One present, three Englishes', 'trabajo = I work, I’m working, I do work.']
  ],
  items: [
    W('hablar', 'hablar', ['to speak', 'to talk'], { forms: ['hablar', 'hablo', 'hablas', 'habla', 'hablamos', 'hablan'] }),
    W('trabajar', 'trabajar', ['to work'], { forms: ['trabajar', 'trabajo', 'trabajas', 'trabaja', 'trabajamos', 'trabajan'] }),
    W('estudiar', 'estudiar', ['to study'], { cog: true, forms: ['estudiar', 'estudio', 'estudias', 'estudia', 'estudiamos', 'estudian'] }),
    W('necesitar', 'necesitar', ['to need'], { forms: ['necesitar', 'necesito', 'necesitas', 'necesita', 'necesitamos', 'necesitan'] }),
    W('escuchar', 'escuchar', ['to listen', 'to listen to'], { forms: ['escuchar', 'escucho', 'escuchas', 'escucha', 'escuchamos', 'escuchan'] }),
    W('comprar', 'comprar', ['to buy'], { forms: ['comprar', 'compro', 'compras', 'compra', 'compramos', 'compran'] }),
    W('cocinar', 'cocinar', ['to cook'], { forms: ['cocinar', 'cocino', 'cocinas', 'cocina', 'cocinamos', 'cocinan'] }),
    W('buscar', 'buscar', ['to look for', 'to search for'], { forms: ['buscar', 'busco', 'buscas', 'busca', 'buscamos', 'buscan'] }),

    P('pi-hablamos', 'Hablamos español.', PERSONS, 3, 'We speak Spanish.', '-amos = nosotros.'),
    P('pi-trabajas', 'Trabajas mucho.', PERSONS, 1, 'You work a lot.', '-as = tú.'),
    P('pi-cocino', 'Cocino los sábados.', PERSONS, 0, 'I cook on Saturdays.', '-o = yo.'),

{

  if (b.dataset.shadow) return shadowRate(b.dataset.shadow === 'ok');

  if (b.id === 'w-next') { const ps = writePrompts(); const cur = ps.findIndex(x => x[1] === curPrompt()); wPick = (cur + 1) % ps.length; wRes = null; wErr = ''; render(); return; }
  if (b.dataset.wacc) { const ta = $('#w-text'); if (ta) { const p = ta.selectionStart ?? ta.value.length; ta.value = ta.value.slice(0, p) + b.dataset.wacc + ta.value.slice(ta.selectionEnd ?? p); wDraft = ta.value; ta.focus(); ta.setSelectionRange(p + 1, p + 1); } return; }
  if (b.dataset.go) { view = b.dataset.go; render(); return; }
  if (b.id === 'start') return startSession();
  if (b.id === 'more') return startSession(true);
  if (b.id === 'quit' || b.id === 'done') { sess = null; render(); return; }
  if (b.id === 'next') return next();
  if (b.id === 'idk') return answer('', -1);
  if (b.dataset.opt !== undefined && sess && sess.phase === 'ask') return answer('', +b.dataset.opt);
  if (b.dataset.acc) { const i = $('#ans-in'); if (i) { const p = i.selectionStart ?? i.value.length; i.value = i.value.slice(0, p) + b.dataset.acc + i.value.slice(i.selectionEnd ?? p); i.focus(); i.setSelectionRange(p + 1, p + 1); } return; }
  if (b.dataset.focus !== undefined) { const n = +b.dataset.focus; S.focus = S.focus === n ? null : n; save(); render(); return; }
  if (b.dataset.story) { openStory = STORIES.find(s => s.id === b.dataset.story); render(); window.scrollTo(0, 0); return; }
  if (b.id === 'back') { openStory = null; openDaily = false; render(); return; }
  if (b.id === 'show-en') { const p = $('#story-en'); p.hidden = !p.hidden; b.textContent = p.hidden ? 'Show English' : 'Hide English'; return; }
  if (b.dataset.word !== undefined) {
    const w = b.dataset.word, n = normEs(w), s0 = openStory; const ex = {}; Object.entries(s0.gl || {}).forEach(([k, v]) => { ex[k] = { en: v, lemma: k }; });
    const g = glossFor(n, ex) || (s0.free.includes(n) ? { en: 'name or cognate', known: true } : null);
    $('#gloss').innerHTML = glossBar(w, g, sentenceWith(s0.text, w), s0.title, false); speak(w); return;
  }
  if (b.dataset.sq !== undefined) { const q = openStory.qs[+b.dataset.sq]; const ok = +b.dataset.so === q[2]; b.classList.add(ok ? 'right' : 'wrong'); return; }
  if (b.id === 'finish-story') { S.read[openStory.id] = true; addXP(20); save(); render(); return; }
  if (b.dataset.item) {
    const it = ITEM[b.dataset.item]; const cards = it.kind === 'w' ? [it.id + ':r', it.id + ':p'] : [it.id + ':x'];
    const label = it.kind === 'w' ? `${it.es} = ${it.en[0]}` : it.kind === 'd' ? it.say : it.kind === 'c' ? it.q.replace('___', it.a[0]) : it.q;
    $('#g-detail').innerHTML = `<p class="story-name" lang="es">${esc(label)}</p>${cards.map(cid => { const x = st(cid); const nm = cid.endsWith(':p') ? 'English → Spanish' : cid.endsWith(':r') ? 'Spanish → English' : 'Practice'; return `<p class="small"><b>${nm}:</b> ${x ? `stability ${x.s < 1 ? x.s.toFixed(2) : x.s.toFixed(1)} days · difficulty ${x.d.toFixed(1)}/10 · recall now ${Math.round(FSRS.Rnow(x, now()) * 100)}% · next ${relTime(x.due).replace('in -', '')}` : (cid.endsWith(':p') ? 'unlocks after the Spanish → English card survives 3 days' : 'not started')}</p>`; }).join('')}`;
    return;
  }
  if (b.id === 'backup') { const txt = JSON.stringify(S); const box = $('#set-extra'); box.innerHTML = `<textarea id="bk" rows="3" readonly>${esc(txt)}</textarea><p class="small">Copied. Keep this text somewhere safe.</p>`; try { navigator.clipboard.writeText(txt).catch(() => $('#bk').select()); } catch (er) { $('#bk').select(); } return; }
  if (b.id === 'restore') { $('#set-extra').innerHTML = `<textarea id="rs" rows="3" placeholder="Paste a backup here"></textarea><button class="btn sm" id="rs-go">Restore</button>`; return; }
  if (b.id === 'rs-go') { try { const o = JSON.parse($('#rs').value); if (!o.cards) throw 0; S = Object.assign(DEFAULT(), o); migrate(); registerMine(); save(); render(); } catch (er) { $('#set-extra').insertAdjacentHTML('beforeend', '<p class="note warn">That text isn’t a Sendero backup.</p>'); } return; }
  if (b.id === 'reset') { $('#set-extra').innerHTML = `<p class="note warn">This erases every card, your XP and your streak. It can’t be undone.</p><button class="btn danger sm" id="reset-go">Erase everything</button>`; return; }
  if (b.id === 'reset-go') { S = DEFAULT(); save(); render(); return; }
});
document.addEventListener('submit', e => { if (e.target.id === 'ans') { e.preventDefault(); if (sess && sess.phase === 'ask') answer($('#ans-in').value, -1); } });
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 's-ret') { S.settings.retention = +t.value; save(); render(); }
  if (t.id === 's-size') { S.settings.session = +t.value; save(); render(); }
  if (t.id === 's-goal') { S.settings.goal = +t.value; save(); render(); }
  if (t.id === 's-new') { S.settings.newPerDay = +t.value; save(); render(); }
  if (t.id === 'file-in' && t.files && t.files[0]) { loadProgressFile(t.files[0]); t.value = ''; return; }
  if (t.id === 's-daily') { S.settings.daily = +t.value; Object.assign(S.settings, PRESET[+t.value]); save(); render(); }
  if (t.id === 'shadow-hide') { shadowHide = t.checked; const el = $('#shadow-es'); if (el) el.classList.toggle('blur', shadowHide); }
});
document.addEventListener('input', e => { if (e.target.id === 'w-text') { wDraft = e.target.value; return; } if (e.target.id === 's-ret') { const o = e.target.previousElementSibling.querySelector('output'); if (o) o.textContent = Math.round(e.target.value * 100) + '%'; } });
document.addEventListener('keydown', e => {
  if (sprint && !sprint.done && view === 'play' && /^[1-4]$/.test(e.key)) { sprintAnswer(+e.key - 1); return; }
  if (!sess) return;
  if (sess.phase === 'show' && e.key === 'Enter' && e.target.id !== 'next') { e.preventDefault(); next(); return; }
  if (sess.phase === 'ask' && /^[1-9]$/.test(e.key) && document.activeElement.tagName !== 'INPUT') {
    const b = document.querySelector(`[data-opt="${+e.key - 1}"]`); if (b) b.click();
  }
});
const h = (location.hash || '').slice(1); if (TABS.some(([id]) => id === h)) view = h;
render();
})();

</script>
